[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "projection-workbench"
version = "0.0.1"
description = "Local-first project semantics witness for task-relative ProjectLens construction"
requires-python = ">=3.11"
license = {text = "License decision pending owner review"}
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.scripts]
project-semantics = "project_semantics.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
