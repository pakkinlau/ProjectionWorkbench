name: apply-f-ruv-w3r-b1-payload

on:
  push:
    branches:
      - agent/f-ruv-w3r-b1-terminal-admission-integrity-repair

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Rehydrate bounded repair payload
        shell: bash
        run: |
          set -euo pipefail
          cat .gva-transfer/f-ruv-w3r-b1-payload.part* > /tmp/f-ruv-w3r-b1-payload.b64
          base64 -d /tmp/f-ruv-w3r-b1-payload.b64 > /tmp/f-ruv-w3r-b1-payload.tar.gz
          echo '9fa65396ff8aa47f348cf1b10f12da2be752dd9d9afa87c029f6b0b86303ac6c  /tmp/f-ruv-w3r-b1-payload.tar.gz' | sha256sum -c -
          tar -xzf /tmp/f-ruv-w3r-b1-payload.tar.gz -C .
          rm -rf .gva-transfer
          rm -f .github/workflows/apply-f-ruv-w3r-b1-payload.yml
      - name: Validate full repository and bounded repair
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m unittest discover -s tests -v
          PYTHONPATH=src python scripts/run_f_ruv_w3r_b1_terminal_admission_integrity_repair.py --output /tmp/TerminalAdmissionIntegrityRepair.v1.json
          PYTHONPATH=src python scripts/run_f_ruv_w3_b8_independent_measurement_validity_review.py --output /tmp/IndependentMeasurementValidityReview.v1.json
          python - <<'PY'
          import json
          repair=json.load(open('/tmp/TerminalAdmissionIntegrityRepair.v1.json'))
          review=json.load(open('/tmp/IndependentMeasurementValidityReview.v1.json'))
          assert repair['terminal_disposition']=='TERMINAL_ADMISSION_INTEGRITY_REPAIRED_AT_CONTROLLED_FIXTURE_CEILING'
          assert repair['repair_coordinates']['canonical_terminal_reachability']['pass'] is True
          assert review['executable_attack_summary']['confirmed_gaps']==3
          assert review['executable_attack_summary']['repaired_gaps']==2
          PY
      - name: Publish reviewed repair checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(ruv): bind terminal admission to typed receipts'
          git push origin HEAD:${GITHUB_REF_NAME}
