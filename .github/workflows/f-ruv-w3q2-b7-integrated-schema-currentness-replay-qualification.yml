name: f-ruv-w3q2-b7-integrated-schema-currentness-replay-qualification

on:
  push:
    branches:
      - agent/f-ruv-w3q2-b7-integrated-schema-currentness-replay-qualification
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
      ASSEMBLY_DIR: /tmp/f-ruv-w3q2-b7-assembly
      TARGET_DIR: /tmp/f-ruv-w3q2-b7-target
      OWNED_DIR: /tmp/f-ruv-w3q2-b7-owned
      OUT_DIR: /tmp/f-ruv-w3q2-b7-result
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.TARGET_BRANCH }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Park branch-owned qualification surfaces
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OWNED_DIR" "$ASSEMBLY_DIR" "$TARGET_DIR" "$OUT_DIR"
          mkdir -p "$OWNED_DIR" "$ASSEMBLY_DIR" "$TARGET_DIR" "$OUT_DIR"
          while IFS= read -r path; do
            mkdir -p "$OWNED_DIR/$(dirname "$path")"
            cp "$path" "$OWNED_DIR/$path"
            rm "$path"
          done <<'EOF'
          .github/workflows/f-ruv-w3q2-b7-integrated-schema-currentness-replay-qualification.yml
          .gva-target/FinalIntegratedW3RTarget.v1.json
          qualification/f_ruv_w3q2_b7/README.md
          qualification/f_ruv_w3q2_b7/fresh_agent_probe.py
          qualification/f_ruv_w3q2_b7/run_integrated_schema_currentness_replay_qualification.py.gz.b64
          qualification/f_ruv_w3q2_b7/QUALIFIER_CARRIER.json
          EOF

      - name: Bind accepted W3I deterministic assembly procedure
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path=Path('scripts/run_f_ruv_w3i_b1_integrated_w3r_assembly.sh')
          text=path.read_text(encoding='utf-8')
          replacements=[
            (
              "skip={'.github/workflows/apply-f-ruv-w3r-b1-payload.yml'}",
              "skip={'.github/workflows/apply-f-ruv-w3r-b1-payload.yml','scripts/run_f_ruv_w3_b8_independent_measurement_validity_review.py','tests/test_f_ruv_w3_b8_independent_measurement_validity_review.py'}",
            ),
            (
              'bash scripts/run_f_ruv_w3r_b3_clean_room_fresh_agent_repair.sh "$ROOT" "$OUT/CleanRoomFreshAgentRepair.v1.json" 2>&1 | tee "$OUT/clean_room_stdout.txt"',
              'python scripts/run_f_ruv_w3i_integrated_clean_room.py "$ROOT" "$OUT/CleanRoomFreshAgentRepair.v1.json" 2>&1 | tee "$OUT/clean_room_stdout.txt"',
            ),
            (
              "clean.get('terminal_disposition')=='CLEAN_ROOM_FRESH_AGENT_REPAIR_PASS'",
              "clean.get('terminal_disposition')=='INTEGRATED_CLEAN_ROOM_FRESH_AGENT_PASS'",
            ),
            (
              '(cd "$OUT" && sha256sum * > SHA256SUMS)',
              '(cd "$OUT" && find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)',
            ),
          ]
          for old,new in replacements:
              if old not in text:
                  raise SystemExit('integration patch anchor absent: '+old)
              text=text.replace(old,new,1)
          path.write_text(text,encoding='utf-8')
          PY

      - name: Reconstruct exact content-addressed W3R target
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/run_f_ruv_w3i_b1_integrated_w3r_assembly.sh "$ASSEMBLY_DIR"
          echo '54ad0ee3651b391ff965fb5bc89954e66e061d4e6ff1e8504d090a6b427e5779  '"$ASSEMBLY_DIR/IntegratedW3RRepairAssembly.patch" | sha256sum -c -
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/f-ruv-w3q2-b7-assembly/IntegratedW3RRepairAssembly.v1.json')
          x=json.loads(p.read_text())
          assert x['terminal_disposition']=='INTEGRATED_W3R_REPAIR_ASSEMBLY_PASS_AT_CONTROLLED_LOCAL_CEILING'
          assert all(x['checks'].values())
          PY

      - name: Freeze reconstructed target in isolated directory
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$TARGET_DIR"
          mkdir -p "$TARGET_DIR"
          tar \
            --exclude=.git \
            --exclude=.gva-target \
            --exclude=qualification/f_ruv_w3q2_b7 \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude=build \
            --exclude=dist \
            --exclude='*.egg-info' \
            -cf - . | tar -xf - -C "$TARGET_DIR"
          cp "$ASSEMBLY_DIR/IntegratedW3RRepairAssembly.patch" /tmp/IntegratedW3RRepairAssembly.patch
          cp "$ASSEMBLY_DIR/full_unit_suite.txt" "$OUT_DIR/full_unit_suite.log"
          grep -q "Ran 128 tests" "$OUT_DIR/full_unit_suite.log"
          tail -n 3 "$OUT_DIR/full_unit_suite.log" | grep -q "OK"

      - name: Restore branch-owned qualification surfaces
        shell: bash
        run: |
          set -euo pipefail
          cp -a "$OWNED_DIR"/. .
          base64 -d qualification/f_ruv_w3q2_b7/run_integrated_schema_currentness_replay_qualification.py.gz.b64 | gzip -d > /tmp/run_integrated_schema_currentness_replay_qualification.py
          test "$(sha256sum /tmp/run_integrated_schema_currentness_replay_qualification.py | awk '{print $1}')" = "a10902c75f7e22bc96d4b6f14ccc00811db74b5a453a85035a44f6116084d15b"
          python -m compileall -q qualification/f_ruv_w3q2_b7 /tmp/run_integrated_schema_currentness_replay_qualification.py

      - name: Re-run inherited W3R.B7 31-case witness on frozen target
        shell: bash
        run: |
          set -euo pipefail
          cd "$TARGET_DIR"
          PYTHONPATH=src python scripts/run_f_ruv_w3r_b7_schema_currentness_replay_repair.py \
            --output "$OUT_DIR/SchemaCurrentnessReplayRepair.rerun.json"
          python - <<'PY'
          import json
          p='/tmp/f-ruv-w3q2-b7-result/SchemaCurrentnessReplayRepair.rerun.json'
          x=json.load(open(p))
          assert x['terminal_disposition']=='SCHEMA_CURRENTNESS_REPLAY_REPAIR_PASS'
          assert x['case_summary']=={'failed':0,'passed':31,'total':31}
          PY

      - name: Build source and wheel fresh-agent installations
        shell: bash
        run: |
          set -euo pipefail
          PROBE="$GITHUB_WORKSPACE/qualification/f_ruv_w3q2_b7/fresh_agent_probe.py"
          rm -rf /tmp/ruv-src-a /tmp/ruv-src-b /tmp/ruv-whl-a /tmp/ruv-whl-b /tmp/wheel-a /tmp/wheel-b
          python -m venv /tmp/ruv-src-a
          python -m venv /tmp/ruv-src-b
          /tmp/ruv-src-a/bin/python -m pip install --disable-pip-version-check --no-deps --no-build-isolation "$TARGET_DIR"
          /tmp/ruv-src-b/bin/python -m pip install --disable-pip-version-check --no-deps --no-build-isolation "$TARGET_DIR"
          mkdir -p /tmp/wheel-a /tmp/wheel-b
          python -m pip wheel --disable-pip-version-check --no-deps --no-build-isolation "$TARGET_DIR" -w /tmp/wheel-a
          python -m pip wheel --disable-pip-version-check --no-deps --no-build-isolation "$TARGET_DIR" -w /tmp/wheel-b
          WHEEL_A=$(find /tmp/wheel-a -name '*.whl' -type f -print -quit)
          WHEEL_B=$(find /tmp/wheel-b -name '*.whl' -type f -print -quit)
          test -n "$WHEEL_A" -a -n "$WHEEL_B"
          sha256sum "$WHEEL_A" "$WHEEL_B" > "$OUT_DIR/wheel-build-sha256.txt"
          python -m venv /tmp/ruv-whl-a
          python -m venv /tmp/ruv-whl-b
          /tmp/ruv-whl-a/bin/python -m pip install --disable-pip-version-check --no-deps "$WHEEL_A"
          /tmp/ruv-whl-b/bin/python -m pip install --disable-pip-version-check --no-deps "$WHEEL_B"
          cd /tmp
          env -u PYTHONPATH PYTHONNOUSERSITE=1 FORBIDDEN_CHECKOUT="$TARGET_DIR" /tmp/ruv-src-a/bin/python "$PROBE" --output "$OUT_DIR/fresh-source-a.json"
          env -u PYTHONPATH PYTHONNOUSERSITE=1 FORBIDDEN_CHECKOUT="$TARGET_DIR" /tmp/ruv-src-b/bin/python "$PROBE" --output "$OUT_DIR/fresh-source-b.json"
          env -u PYTHONPATH PYTHONNOUSERSITE=1 FORBIDDEN_CHECKOUT="$TARGET_DIR" /tmp/ruv-whl-a/bin/python "$PROBE" --output "$OUT_DIR/fresh-wheel-a.json"
          env -u PYTHONPATH PYTHONNOUSERSITE=1 FORBIDDEN_CHECKOUT="$TARGET_DIR" /tmp/ruv-whl-b/bin/python "$PROBE" --output "$OUT_DIR/fresh-wheel-b.json"
          cmp "$OUT_DIR/fresh-source-a.json" "$OUT_DIR/fresh-source-b.json"
          cmp "$OUT_DIR/fresh-wheel-a.json" "$OUT_DIR/fresh-wheel-b.json"
          cmp "$OUT_DIR/fresh-source-a.json" "$OUT_DIR/fresh-wheel-a.json"

      - name: Execute independent integrated W3Q2.B7 qualifier
        shell: bash
        run: |
          set -euo pipefail
          cd "$TARGET_DIR"
          PYTHONPATH=src python /tmp/run_integrated_schema_currentness_replay_qualification.py \
            --target-root "$TARGET_DIR" \
            --patch-path /tmp/IntegratedW3RRepairAssembly.patch \
            --full-suite-log "$OUT_DIR/full_unit_suite.log" \
            --repair-result "$OUT_DIR/SchemaCurrentnessReplayRepair.rerun.json" \
            --fresh-probe "$OUT_DIR/fresh-source-a.json" \
            --fresh-probe "$OUT_DIR/fresh-source-b.json" \
            --fresh-probe "$OUT_DIR/fresh-wheel-a.json" \
            --fresh-probe "$OUT_DIR/fresh-wheel-b.json" \
            --output-dir "$OUT_DIR/returns"
          python - <<'PY'
          import json
          p='/tmp/f-ruv-w3q2-b7-result/returns/IntegratedSchemaCurrentnessReplayQualification.v1.json'
          x=json.load(open(p))
          assert x['terminal_disposition']=='INTEGRATED_SCHEMA_CURRENTNESS_REPLAY_QUALIFIED_AT_CONTROLLED_CEILING'
          assert x['case_summary']=={'total':35,'passed':35,'failed':0}
          assert x['target_mutated'] is False
          assert x['prior_wave_payload_bytes_embedded']==0
          assert x['wave_4_open_from_this_branch'] is False
          PY

      - name: Build pointer-slim evidence index
        shell: bash
        run: |
          set -euo pipefail
          cp .gva-target/FinalIntegratedW3RTarget.v1.json "$OUT_DIR/FinalIntegratedW3RTarget.pointer.json"
          {
            echo "stewardstack_current=5713f1fffdea8e56dd6f0242a4c247c7b4ae7659"
            echo "route_tree=1b30eec0f7967f8ad24fab6a55bfaea2ddaec719"
            echo "route_launch_digest=a4848d67212416935e25d8f4fc09b3aeee1b62b4c761c5cfd7055eb0e4b26baa"
            echo "assembly_source=d41a17d2558ab8957b055e28f383350a4e06c007"
            echo "assembly_artifact_id=9379960992"
            echo "assembly_zip_sha256=606e400a116d3cd07cd7bcd196973aa8ff954be11d0997ec9e4f5e8cdf81be7f"
            echo "base_commit=e289a2ff01ee31f2f32e85247a2956a835e3c175"
            echo "target_identity=sha256:54ad0ee3651b391ff965fb5bc89954e66e061d4e6ff1e8504d090a6b427e5779"
            echo "integrated_patch_sha256=54ad0ee3651b391ff965fb5bc89954e66e061d4e6ff1e8504d090a6b427e5779"
            echo "prior_wave_payload_bytes_embedded=0"
          } > "$OUT_DIR/SOURCE_POINTERS.txt"
          find "$OUT_DIR/returns" -type f -maxdepth 1 -print0 | sort -z | xargs -0 sha256sum > "$OUT_DIR/RETURNS_SHA256SUMS"
          find "$OUT_DIR" -maxdepth 1 -type f ! -name EVIDENCE_SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > "$OUT_DIR/EVIDENCE_SHA256SUMS"

      - uses: actions/upload-artifact@v4
        with:
          name: GVA06_F_RUV_W3Q2_B7_N2B_EVIDENCE
          path: |
            /tmp/f-ruv-w3q2-b7-result/returns/
            /tmp/f-ruv-w3q2-b7-result/SchemaCurrentnessReplayRepair.rerun.json
            /tmp/f-ruv-w3q2-b7-result/fresh-source-a.json
            /tmp/f-ruv-w3q2-b7-result/fresh-source-b.json
            /tmp/f-ruv-w3q2-b7-result/fresh-wheel-a.json
            /tmp/f-ruv-w3q2-b7-result/fresh-wheel-b.json
            /tmp/f-ruv-w3q2-b7-result/FinalIntegratedW3RTarget.pointer.json
            /tmp/f-ruv-w3q2-b7-result/SOURCE_POINTERS.txt
            /tmp/f-ruv-w3q2-b7-result/RETURNS_SHA256SUMS
            /tmp/f-ruv-w3q2-b7-result/EVIDENCE_SHA256SUMS
            /tmp/f-ruv-w3q2-b7-result/wheel-build-sha256.txt
            /tmp/f-ruv-w3q2-b7-result/full_unit_suite.log
          if-no-files-found: error
          retention-days: 30
