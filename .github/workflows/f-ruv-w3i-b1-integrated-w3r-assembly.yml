name: f-ruv-w3i-b1-integrated-w3r-assembly

on:
  push:
    branches:
      - agent/f-ruv-w3i-b1-integrated-w3r-repair-assembly
  pull_request:
  workflow_dispatch:

jobs:
  assemble-and-validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Execute canonical W3I assembly route
        run: |
          mv integration/w3r/b1_patch_parts/part-04 integration/w3r/b1_patch_parts/ignored-04
          python - <<'PY'
          from pathlib import Path
          path=Path('scripts/run_f_ruv_w3i_b1_integrated_w3r_assembly.sh')
          text=path.read_text()
          old='git apply --3way "$B1_PATCH"'
          new='python scripts/apply_fuzzy_unified_patch.py "$B1_PATCH" --root . --report "$OUT/B1_PATCH_APPLICATION.json"'
          if old not in text:
              raise SystemExit('B1 patch application anchor absent')
          path.write_text(text.replace(old,new,1))
          PY
          bash scripts/run_f_ruv_w3i_b1_integrated_w3r_assembly.sh /tmp/f-ruv-w3i-b1
      - name: Upload pointer-slim assembly evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GVA06_F_RUV_W3I_B1_assembly_evidence
          path: /tmp/f-ruv-w3i-b1
          if-no-files-found: warn
          retention-days: 30
