name: F2 W8 B2 integration validation

on:
  push:
    branches:
      - agent/f2-w8-b2-postw7-exchange-domain-neutral-integration
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run full suite
        run: PYTHONPATH=src:. python -m pytest -q
      - name: Run integrated witness
        run: |
          PYTHONPATH=src:. python scripts/run_f2_w8_b2_postw7_integration.py --output /tmp/f2_w8_b2_result.json
          cat /tmp/f2_w8_b2_result.json
