name: f-ruv-w3i-semantic-b1-port

on:
  push:
    branches:
      - agent/f-ruv-w3i-b1-integrated-w3r-repair-assembly-v2
  workflow_dispatch:

permissions:
  contents: write

jobs:
  semantic-port-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: agent/f-ruv-w3i-b1-integrated-w3r-repair-assembly-v2
      BASE: e289a2ff01ee31f2f32e85247a2956a835e3c175
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.TARGET_BRANCH }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Rehydrate B1 payload into temporary tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/b1payload /tmp/w3i-port
          mkdir -p /tmp/b1payload /tmp/w3i-port
          cat .gva-transfer/f-ruv-w3r-b1-payload.part* > /tmp/b1payload.b64
          base64 -d /tmp/b1payload.b64 > /tmp/b1payload.tar.gz
          echo '9fa65396ff8aa47f348cf1b10f12da2be752dd9d9afa87c029f6b0b86303ac6c  /tmp/b1payload.tar.gz' | sha256sum -c -
          tar -xzf /tmp/b1payload.tar.gz -C /tmp/b1payload
          find /tmp/b1payload -type f -printf '%P\n' | sort | tee /tmp/w3i-port/B1_PAYLOAD_FILE_INDEX.txt
      - name: Semantic three-way port
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$BASE"
          python - <<'PY'
          from pathlib import Path
          import subprocess, tempfile, shutil, json, os

          root = Path.cwd()
          payload = Path('/tmp/b1payload')
          evidence = Path('/tmp/w3i-port')
          base = os.environ['BASE']
          skip = {
              '.github/workflows/apply-f-ruv-w3r-b1-payload.yml',
          }
          actions=[]
          conflicts=[]

          def git_show(path: str):
              p=subprocess.run(['git','show',f'{base}:{path}'],cwd=root,stdout=subprocess.PIPE,stderr=subprocess.DEVNULL)
              return p.stdout if p.returncode==0 else None

          def merge_text(current: bytes, base_bytes: bytes, incoming: bytes, rel: str):
              with tempfile.TemporaryDirectory() as td:
                  td=Path(td)
                  ours=td/'ours'; ancestor=td/'base'; theirs=td/'theirs'
                  ours.write_bytes(current); ancestor.write_bytes(base_bytes); theirs.write_bytes(incoming)
                  p=subprocess.run(['git','merge-file','-p',str(ours),str(ancestor),str(theirs)],stdout=subprocess.PIPE,stderr=subprocess.PIPE)
                  if p.returncode==0:
                      return p.stdout
                  conflicts.append({'path':rel,'stderr':p.stderr.decode('utf-8','replace')})
                  return None

          for src in sorted(p for p in payload.rglob('*') if p.is_file()):
              rel=src.relative_to(payload).as_posix()
              if rel in skip or rel.startswith('.gva-transfer/'):
                  continue
              dst=root/rel
              incoming=src.read_bytes()
              if not dst.exists():
                  dst.parent.mkdir(parents=True,exist_ok=True)
                  dst.write_bytes(incoming)
                  actions.append({'path':rel,'action':'ADD_B1'})
                  continue
              current=dst.read_bytes()
              if current==incoming:
                  actions.append({'path':rel,'action':'IDENTICAL'})
                  continue
              ancestor=git_show(rel)
              if ancestor is None:
                  conflicts.append({'path':rel,'stderr':'no base ancestor for differing existing file'})
                  continue
              if current==ancestor:
                  dst.write_bytes(incoming)
                  actions.append({'path':rel,'action':'TAKE_B1_OVER_BASE'})
                  continue
              if incoming==ancestor:
                  actions.append({'path':rel,'action':'KEEP_INTEGRATED_B1_UNCHANGED'})
                  continue
              try:
                  current.decode('utf-8'); ancestor.decode('utf-8'); incoming.decode('utf-8')
              except UnicodeDecodeError:
                  conflicts.append({'path':rel,'stderr':'binary overlap requires explicit resolution'})
                  continue
              merged=merge_text(current,ancestor,incoming,rel)
              if merged is not None:
                  dst.write_bytes(merged)
                  actions.append({'path':rel,'action':'THREE_WAY_TEXT_MERGE'})

          # Public surface is an explicit integration decision, not an accidental merge result.
          harness=root/'src/repeat_use_harness/harness.py'
          harness.write_text('''\"\"\"Integrated compatibility re-export for the repeat-use harness.\"\"\"\nfrom .constants import *\nfrom .core import *\nfrom .admission import *\nfrom .normalization import *\nfrom .replay import *\nfrom .storage import *\nfrom .fixture import *\nfrom .counterfactual import *\nfrom .custody_repair import *\nfrom .comparator_parity import *\nfrom .noninterference import *\n# Import last: the repair membrane intentionally overrides legacy public names.\nfrom .schema_currentness import *\n''',encoding='utf-8')
          init=root/'src/repeat_use_harness/__init__.py'
          init.write_text('''\"\"\"Public surface for the integrated repeat-use value-discovery harness.\"\"\"\nfrom .harness import *\n\nB2_CASE_SCHEMA = \"gva06.f.ruv.oracle-case.v1\"\n\n__all__ = [name for name in globals() if not name.startswith(\"_\")]\n__version__ = \"1.2.1\"\n''',encoding='utf-8')
          actions.append({'path':'src/repeat_use_harness/harness.py','action':'EXPLICIT_INTEGRATED_PUBLIC_SURFACE'})
          actions.append({'path':'src/repeat_use_harness/__init__.py','action':'EXPLICIT_INTEGRATED_PUBLIC_SURFACE'})

          (evidence/'SEMANTIC_PORT_ACTIONS.json').write_text(json.dumps(actions,indent=2,sort_keys=True)+'\n')
          (evidence/'SEMANTIC_PORT_CONFLICTS.json').write_text(json.dumps(conflicts,indent=2,sort_keys=True)+'\n')
          if conflicts:
              raise SystemExit('semantic port conflicts remain: '+json.dumps(conflicts,sort_keys=True))
          PY
          rm -rf .gva-transfer
          rm -f .github/workflows/apply-f-ruv-w3r-b1-payload.yml
      - name: Validate integrated target
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q src tests scripts
          PYTHONPATH=src python -m unittest discover -s tests -v 2>&1 | tee /tmp/w3i-port/full_unit_suite.txt
          PYTHONPATH=src python scripts/run_f_ruv_w3r_b1_terminal_admission_integrity_repair.py --output /tmp/w3i-port/TerminalAdmissionIntegrityRepair.v1.json
          python scripts/run_f_ruv_w3r_b2_custody_privacy_burden_requalification.py --output /tmp/w3i-port/CustodyPrivacyBurdenRepairRequalification.v1.json
          PYTHONPATH=src python scripts/run_f_ruv_w3r_b4_noninterference_repair.py --output /tmp/w3i-port/InstrumentationNoninterferenceRepair.v1.json
          PYTHONPATH=src python scripts/run_f_ruv_w3r_b6_comparator_timing_parity_repair.py --output /tmp/w3i-port/ComparatorTimingParityRepair.v1.json --corpus-output /tmp/w3i-port/SyntheticTimingParityCorpus.v2.json
          PYTHONPATH=src python scripts/run_f_ruv_w3r_b7_schema_currentness_replay_repair.py --output /tmp/w3i-port/SchemaCurrentnessReplayRepair.v1.json
          PYTHONPATH=src python scripts/run_f_ruv_w3_b8_independent_measurement_validity_review.py --output /tmp/w3i-port/IndependentMeasurementValidityReview.after-semantic-port.v1.json
          bash scripts/run_f_ruv_w3r_b3_clean_room_fresh_agent_repair.sh "$PWD" /tmp/w3i-port/CleanRoomFreshAgentRepair.v1.json 2>&1 | tee /tmp/w3i-port/clean_room_stdout.txt
          python - <<'PY'
          import json
          from pathlib import Path
          out=Path('/tmp/w3i-port')
          load=lambda n: json.loads((out/n).read_text())
          b1=load('TerminalAdmissionIntegrityRepair.v1.json')
          b2=load('CustodyPrivacyBurdenRepairRequalification.v1.json')
          b4=load('InstrumentationNoninterferenceRepair.v1.json')
          b6=load('ComparatorTimingParityRepair.v1.json')
          b7=load('SchemaCurrentnessReplayRepair.v1.json')
          b8=load('IndependentMeasurementValidityReview.after-semantic-port.v1.json')
          b3=load('CleanRoomFreshAgentRepair.v1.json')
          checks={
            'b1_terminal': b1.get('terminal_disposition')=='TERMINAL_ADMISSION_INTEGRITY_REPAIRED_AT_CONTROLLED_FIXTURE_CEILING',
            'b2_custody': b2.get('summary')=={'total':22,'pass':20,'fail':0,'right_censored':2},
            'b3_clean_room': b3.get('terminal_disposition')=='CLEAN_ROOM_FRESH_AGENT_REPAIR_PASS',
            'b4_noninterference': b4.get('manifest',{}).get('terminal')=='INSTRUMENTATION_NONINTERFERENCE_REPAIR_READY',
            'b6_parity': b6.get('terminal_disposition')=='COMPARATOR_TIMING_PARITY_REPAIR_IMPLEMENTED_AT_CONTROLLED_FIXTURE_CEILING',
            'b7_schema': b7.get('terminal_disposition')=='SCHEMA_CURRENTNESS_REPLAY_REPAIR_PASS',
            'b8_original_attacks_closed': b8.get('executable_attack_summary',{}).get('remaining_gaps')==0,
          }
          (out/'INTEGRATED_TARGET_CHECKS.json').write_text(json.dumps(checks,indent=2,sort_keys=True)+'\n')
          if not all(checks.values()):
              raise SystemExit(json.dumps(checks,sort_keys=True))
          PY
      - name: Freeze repaired target and publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(ruv): materialize semantic B1 integration'
          git push origin HEAD:${TARGET_BRANCH}
          git rev-parse HEAD | tee /tmp/w3i-port/FINAL_INTEGRATED_TARGET_SHA.txt
          git ls-files -s | sha256sum | awk '{print $1}' | tee /tmp/w3i-port/FINAL_INTEGRATED_TREE_INDEX_DIGEST.txt
          (cd /tmp/w3i-port && find . -maxdepth 1 -type f -printf '%f\n' | sort > ARTIFACT_INDEX.txt && sha256sum * > SHA256SUMS)
      - name: Upload repair evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GVA06_F_RUV_W3I_semantic_B1_port_evidence
          path: /tmp/w3i-port
          if-no-files-found: warn
          retention-days: 30
