name: F RUV W3R B5 counterfactual assignment repair

on:
  push:
    branches:
      - agent/f-ruv-w3r-b5-counterfactual-assignment-repair
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run complete repository suite
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Run counterfactual repair suite explicitly
        run: PYTHONPATH=src python -m unittest tests.test_counterfactual_assignment_repair -v
      - name: Build source and wheel distributions
        run: |
          python -m pip install --disable-pip-version-check build
          python -m build
