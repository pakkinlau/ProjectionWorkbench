name: f-ruv-w3q2-b4-integrated-noninterference-reactivity-qualification

on:
  push:
    branches:
      - agent/f-ruv-w3q2-b4-integrated-noninterference-reactivity-qualification
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      TARGET_ROOT: /tmp/f-ruv-w3q2-b4-target
      ASSEMBLY_DIR: /tmp/f-ruv-w3q2-b4-assembly
      RESULT_DIR: /tmp/f-ruv-w3q2-b4-result
      QUALIFICATION_SUBSTRATE: d41a17d2558ab8957b055e28f383350a4e06c007
      TARGET_DIGEST: 54ad0ee3651b391ff965fb5bc89954e66e061d4e6ff1e8504d090a6b427e5779
      ASSEMBLY_DIGEST: f48e690ea1896973bbedf44ce3e7ec621766e1204fffa38aa87c1a6ba911f5ff
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Reconstruct exact immutable W3Q2 target
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$TARGET_ROOT" "$ASSEMBLY_DIR" "$RESULT_DIR"
          mkdir -p "$ASSEMBLY_DIR" "$RESULT_DIR"
          git fetch --no-tags origin "$QUALIFICATION_SUBSTRATE"
          git worktree add --detach "$TARGET_ROOT" "$QUALIFICATION_SUBSTRATE"
          python - "$TARGET_ROOT/scripts/run_f_ruv_w3i_b1_integrated_w3r_assembly.sh" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]); t=p.read_text()
          pairs=[
            ("skip={'.github/workflows/apply-f-ruv-w3r-b1-payload.yml'}",
             "skip={'.github/workflows/apply-f-ruv-w3r-b1-payload.yml','scripts/run_f_ruv_w3_b8_independent_measurement_validity_review.py','tests/test_f_ruv_w3_b8_independent_measurement_validity_review.py'}"),
            ('bash scripts/run_f_ruv_w3r_b3_clean_room_fresh_agent_repair.sh "$ROOT" "$OUT/CleanRoomFreshAgentRepair.v1.json" 2>&1 | tee "$OUT/clean_room_stdout.txt"',
             'python scripts/run_f_ruv_w3i_integrated_clean_room.py "$ROOT" "$OUT/CleanRoomFreshAgentRepair.v1.json" 2>&1 | tee "$OUT/clean_room_stdout.txt"'),
            ("clean.get('terminal_disposition')=='CLEAN_ROOM_FRESH_AGENT_REPAIR_PASS'",
             "clean.get('terminal_disposition')=='INTEGRATED_CLEAN_ROOM_FRESH_AGENT_PASS'"),
            ('(cd "$OUT" && sha256sum * > SHA256SUMS)',
             '(cd "$OUT" && find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)'),
          ]
          for a,b in pairs:
            if a not in t: raise SystemExit('assembly anchor absent: '+a)
            t=t.replace(a,b,1)
          p.write_text(t)
          PY
          (cd "$TARGET_ROOT" && bash scripts/run_f_ruv_w3i_b1_integrated_w3r_assembly.sh "$ASSEMBLY_DIR")
          echo "$TARGET_DIGEST  $ASSEMBLY_DIR/IntegratedW3RRepairAssembly.patch" | sha256sum -c -
      - name: Execute 17-coordinate read-only B4 qualifier twice
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$TARGET_ROOT/src"
          fingerprint() {
            { git -C "$TARGET_ROOT" status --porcelain=v1 --untracked-files=all; \
              git -C "$TARGET_ROOT" diff --binary HEAD; \
              git -C "$TARGET_ROOT" diff --cached --binary HEAD; } | sha256sum | awk '{print $1}'
          }
          fingerprint > "$RESULT_DIR/target.before.sha256"
          python "$GITHUB_WORKSPACE/scripts/run_f_ruv_w3q_b4_instrumentation_requalification.py" \
            --repo-root "$TARGET_ROOT" --output "$RESULT_DIR/legacy-q4.json"
          fingerprint > "$RESULT_DIR/target.after-legacy.sha256"
          cat > "$RESULT_DIR/qualify.py" <<'PY'
          from copy import deepcopy
          import hashlib,json,os,pathlib,re,sys
          import repeat_use_harness.noninterference as ni
          out=pathlib.Path(os.environ['ASSEMBLY_DIR']); res=pathlib.Path(os.environ['RESULT_DIR'])
          root=pathlib.Path(os.environ['TARGET_ROOT']); legacy=json.loads((res/'legacy-q4.json').read_text())
          assembly=json.loads((out/'IntegratedW3RRepairAssembly.v1.json').read_text())
          b4=json.loads((out/'InstrumentationNoninterferenceRepair.v1.json').read_text())
          def C(i,ok,detail): return {'check_id':i,'passed':bool(ok),'detail':detail}
          def sha(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          inherited=[C(x['check_id'],x['passed'],x['detail']) for x in legacy['checks']]
          assert len(inherited)==10
          suite=(out/'full_unit_suite.txt').read_text(errors='replace'); m=re.search(r'Ran\s+(\d+)\s+tests',suite)
          source={'base':'e289a2ff01ee31f2f32e85247a2956a835e3c175','B1':'bb409dba352825b95eb2176097d43fa13150514e','B2':'3434f231f448643e98c75393734f0f1f5e117d54','B3':'f626a674a8b10cf3c97b662bb9ab9ef70453ec7d','B4':'aaccbe75756f6e5ed4a884ce66146d6e1475b2ed','B5':'a97cd81cb861a152e19ea7aa26b3f2f33501c45f','B6':'a8d2d7499ff48c884b992dca5e0373d2142bb95d','B7':'85dbf8dd8e133e92612a0f6cbb8f4892f78e0c03'}
          target_ok=(sha(out/'IntegratedW3RRepairAssembly.patch')==os.environ['TARGET_DIGEST'] and assembly['artifact_digest']==os.environ['ASSEMBLY_DIGEST'] and assembly['source_heads']==source and assembly['terminal_disposition']=='INTEGRATED_W3R_REPAIR_ASSEMBLY_PASS_AT_CONTROLLED_LOCAL_CEILING' and all(assembly['checks'].values()))
          suite_ok=bool(m and int(m.group(1))==128 and 'OK' in suite and 'FAILED' not in suite)
          epoch=b4['experiment_epoch']; policy=b4['policy_bundle']; lo=b4['minimal_surface_snapshot']; hi=b4['standard_surface_snapshot']; contrast=b4['instrumentation_contrast']
          changed=deepcopy(lo); changed['flag_values']['product.semantic_lens_enabled']=not changed['flag_values']['product.semantic_lens_enabled']; changed['surface_digests']['product_surface_digest']=ni._digest_label('w3q2:b4:product-change'); changed.pop('surface_snapshot_digest'); changed.pop('surface_snapshot_ref'); changed['surface_snapshot_digest']=ni.canonical_digest(changed); changed['surface_snapshot_ref']=ni.stable_ref('surface',changed); ni.validate_surface_snapshot(changed)
          cr=ni.build_surface_change_receipt(change_id='w3q2:b4:change',before_snapshot=lo,after_snapshot=changed,planned_contrast=None,outcomes_visible=True,affected_episode_ids=[lo['episode_id']]); closed,boundary=ni.close_epoch_for_change(epoch,cr,closed_at='2026-08-20T00:00:00Z')
          epoch_ok=(cr['new_epoch_required'] and cr['active_episode_disposition']=='RIGHT_CENSORED' and 'P_PRODUCT' in cr['changed_planes'] and closed['state']=='CLOSED' and boundary['next_epoch_required'])
          plan={'contrast_id':contrast['contrast_id'],'allowed_flag_differences':contrast['allowed_flag_differences'],'allowed_digest_differences':contrast['allowed_digest_differences']}
          pc=ni.build_pooling_eligibility_receipt(comparison_id='w3q2:b4:c',left_snapshot=lo,right_snapshot=hi,predeclared_contrast=plan,carryover_status='CONTROLLED'); pu=ni.build_pooling_eligibility_receipt(comparison_id='w3q2:b4:u',left_snapshot=lo,right_snapshot=hi,predeclared_contrast=plan,carryover_status='UNCONTROLLED')
          pooling_ok=(pc['pooling_disposition']=='POOL_ALLOWED' and pu['pooling_disposition']=='NON_IDENTIFIABLE')
          ni.validate_familiarization_receipt(b4['familiarization_receipt']); review=b4['independent_review_binding']; ni.validate_independent_review_binding(review,epoch=epoch,trajectory_digest=review['trajectory_digest'],policy_bundle=policy)
          override=False
          try: ni.qualification_policy_from_bundle(policy,replay_overrides={'capture_review_minutes_ceiling':1})
          except ni.NoninterferenceValidationError: override=True
          mapping=b4['event_mapping_receipt']; md=dict(mapping); digest=md.pop('mapping_digest')
          binding_ok=(override and mapping['safe_for_replay'] and bool(mapping['declared_losses']) and ni.canonical_digest(md)==digest and lo['history_snapshot_ref']==hi['history_snapshot_ref']=='history:valid' and lo['flag_values']['history.condition']==hi['flag_values']['history.condition']=='VALID_ACCUMULATED' and policy['evidence_rung']=='R0_MECHANICAL')
          no_promotion=(legacy['human_value_supported'] is False and legacy['product_direction_authorized'] is False and legacy['wave4_open'] is False and b4['human_observation_state']=='SYNTHETIC_MECHANICAL_ONLY' and b4['reactivity_result']['human_value_supported'] is False)
          before=(res/'target.before.sha256').read_text().strip(); after=(res/'target.after-legacy.sha256').read_text().strip(); external=not any((root/p).exists() for p in ['scripts/run_f_ruv_w3q_b4_instrumentation_requalification.py','.github/workflows/f-ruv-w3q2-b4-integrated-noninterference-reactivity-qualification.yml'])
          extra=[C('Q4.11_EXACT_TARGET_AND_ASSEMBLY',target_ok,{'target':os.environ['TARGET_DIGEST'],'assembly':assembly['artifact_digest']}),C('Q4.12_FULL_INTEGRATED_SUITE',suite_ok,{'tests':int(m.group(1)) if m else 0}),C('Q4.13_EPOCH_CHANGE_RIGHT_CENSOR',epoch_ok,{'disposition':cr['active_episode_disposition']}),C('Q4.14_POOLING_NONCOMPENSATORY',pooling_ok,{'controlled':pc['pooling_disposition'],'uncontrolled':pu['pooling_disposition']}),C('Q4.15_REVIEW_HISTORY_POLICY_AND_MIGRATION_BINDING',binding_ok,{'losses':mapping['declared_losses']}),C('Q4.16_NO_HUMAN_OR_PRODUCT_PROMOTION',no_promotion,{'human':False,'product':False,'wave4':False}),C('Q4.17_TARGET_NONMUTATION_AND_EXTERNAL_QUALIFIER',before==after and external,{'before':before,'after':after,'external':external})]
          checks=inherited+extra; failed=[x['check_id'] for x in checks if not x['passed']]; ok=not failed
          result={'schema_version':'gva06.f.ruv.w3q2.integrated-noninterference-reactivity-qualification.v1','artifact_id':'IntegratedNoninterferenceReactivityQualification.v1','artifact_state':'EXECUTED_VALIDATED_MERGEABLE_CANDIDATE' if ok else 'EXECUTED_REPAIR_REQUIRED','program_id':'GVA06.F.repeat-use-value-discovery.v2','wave_id':'F.RUV.W3Q2','branch_id':'F.RUV.W3Q2.B4','terminal_disposition':'INTEGRATED_NONINTERFERENCE_REACTIVITY_QUALIFIED_AT_CONTROLLED_MECHANICAL_CEILING' if ok else 'SELECTIVE_REPAIR_REQUIRED','q4_coordinate':'Q4_PASS' if ok else 'Q4_NOT_PASS','first_zero':'F.RUV.W3Q2.CONJUNCTIVE_N3_MERGE_PENDING' if ok else failed[0],'source_binding':{'stewardstack_commit':'5713f1fffdea8e56dd6f0242a4c247c7b4ae7659','route_semantic_tree':'1b30eec0f7967f8ad24fab6a55bfaea2ddaec719','route_launch_digest':'a4848d67212416935e25d8f4fc09b3aeee1b62b4c761c5cfd7055eb0e4b26baa','qualification_substrate':os.environ['QUALIFICATION_SUBSTRATE']},'target_binding':{'target_id':'sha256:'+os.environ['TARGET_DIGEST'],'base_commit':source['base'],'integrated_patch_sha256':os.environ['TARGET_DIGEST'],'assembly_artifact_digest':os.environ['ASSEMBLY_DIGEST'],'source_heads':source},'checks':checks,'check_summary':{'total':17,'passed':17-len(failed),'failed':len(failed)},'failed_checks':failed,'b4_witness_digest':b4['witness_digest'],'integrated_suite_tests':int(m.group(1)) if m else 0,'branch_execution_completed':True,'target_mutated':before!=after,'prior_wave_payload_bytes_embedded':0,'human_value_supported':False,'product_direction_authorized':False,'wave4_open':False,'claim_ceiling':'Independent integrated instrumentation/noninterference/reactivity qualification at a controlled mechanical and source-currentness ceiling only; no human-value, product-direction, Wave-4, release, merge, cutover, market, network, or owner-admission claim.','exact_reentry':'F.RUV.W3Q2.RollingSynthesis -> web.synthesize -> web.steer after all eight target-identical BranchReturns.','learning_or_no_learning_consequence':{'kind':'NoLearningConsequence','policy_or_model_updated':False,'accepted_project_state_mutated':False}}
          result['result_digest']=hashlib.sha256(json.dumps(result,sort_keys=True,separators=(',',':')).encode()).hexdigest(); pathlib.Path(sys.argv[1]).write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          if not ok: raise SystemExit(failed[0])
          PY
          python "$RESULT_DIR/qualify.py" "$RESULT_DIR/result-a.json"
          python "$RESULT_DIR/qualify.py" "$RESULT_DIR/result-b.json"
          cmp "$RESULT_DIR/result-a.json" "$RESULT_DIR/result-b.json"
          cp "$RESULT_DIR/result-a.json" "$RESULT_DIR/IntegratedNoninterferenceReactivityQualification.v1.json"
          fingerprint > "$RESULT_DIR/target.after-all.sha256"
          cmp "$RESULT_DIR/target.before.sha256" "$RESULT_DIR/target.after-all.sha256"
      - name: Validate and package pointer-slim evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,pathlib
          d=pathlib.Path(os.environ['RESULT_DIR']); r=json.loads((d/'IntegratedNoninterferenceReactivityQualification.v1.json').read_text())
          assert r['terminal_disposition']=='INTEGRATED_NONINTERFERENCE_REACTIVITY_QUALIFIED_AT_CONTROLLED_MECHANICAL_CEILING'
          assert r['q4_coordinate']=='Q4_PASS' and r['check_summary']=={'total':17,'passed':17,'failed':0}
          assert r['target_mutated'] is False and r['wave4_open'] is False
          report={'schema_version':'gva06.f.ruv.w3q2.b4.validation-report.v1','target_id':'sha256:'+os.environ['TARGET_DIGEST'],'assembly_artifact_digest':os.environ['ASSEMBLY_DIGEST'],'qualification_substrate':os.environ['QUALIFICATION_SUBSTRATE'],'integrated_suite_tests':128,'qualification_checks':17,'result_reruns_byte_identical':True,'prior_wave_payload_bytes_embedded':0}
          (d/'ValidationReport.v1.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          PY
          cp "$ASSEMBLY_DIR/IntegratedW3RRepairAssembly.v1.json" "$RESULT_DIR/"
          cp "$ASSEMBLY_DIR/InstrumentationNoninterferenceRepair.v1.json" "$RESULT_DIR/"
          rm -f "$RESULT_DIR/qualify.py" "$RESULT_DIR/result-a.json" "$RESULT_DIR/result-b.json" "$RESULT_DIR/legacy-q4.json"
          (cd "$RESULT_DIR" && find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
      - name: Upload pointer-slim B4 qualification evidence
        uses: actions/upload-artifact@v4
        with:
          name: GVA06_F_RUV_W3Q2_B4_qualification_evidence
          path: /tmp/f-ruv-w3q2-b4-result
          if-no-files-found: error
          retention-days: 30
